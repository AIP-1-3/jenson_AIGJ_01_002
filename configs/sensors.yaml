# 수집기 매핑 설정 (과제 1-2: 형식이 바뀌어도 코드가 아니라 이 파일만 고친다)
#
# topic: MQTT 구독 패턴. {space} 같은 자리표시자는 토픽에서 값을 뽑아낸다.
# payload: JSON 필드 → 저장 항목 이름 매핑.
# timestamp: 센서가 찍은 시각 필드. 없으면 수신 시각을 쓴다 (둘 다 저장).
#
# TODO: 실제 토픽·페이로드를 `mosquitto_sub -v -t '#'` 등으로 확인해서 고친다.

sources:
  - name: env_sensor_v1
    topic: "sensors/{space}/env"
    payload:
      co2: co2
      temperature: temp
      humidity: humidity
    timestamp:
      field: ts
      format: epoch_ms           # epoch_s | epoch_ms | iso8601
