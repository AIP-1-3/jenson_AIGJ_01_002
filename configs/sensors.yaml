# 수집기 매핑 설정 (과제 1-2: 형식이 바뀌어도 코드가 아니라 이 파일만 고친다)
# 각 키의 의미는 src/tsinfer/collector/mapping.py 맨 위 설명 참고.
#
# 2026-10-20 브로커에서 확인한 토픽:
#   application/<appId>/device/<devEui>/event/up   ChirpStack v4 LoRaWAN 업링크 (환경 센서)
#   xflow/hvacr/idu/<id>/status                    냉난방 실내기 상태
#   xflow/hvacr/odu/<id>/status                    실외기 상태
#   xflow/controller/<id>/status                   컨트롤러
#   gateway/<id>/state/conn                        게이트웨이 접속 상태 (바이너리, 수집 안 함)

sources:
  # 환경 센서 (CO₂·온도·습도) — ChirpStack 이 디코딩한 값은 object 아래에 있다
  - name: chirpstack_env
    topic: "application/{app_id}/device/{dev_eui}/event/up"
    space:
      from: deviceInfo.deviceName   # 장치 이름 그대로 공간으로. 이름이 공간과 다르면 map 으로 바꾼다
      map: {}                       # 예) "AM319-01": classroom_1
      unmapped: keep
    payload:                        # TODO: 장치 확인 결과(object 필드 이름)에 맞춘다
      co2: object.co2
      temperature: object.temperature
      humidity: object.humidity
    timestamp:
      field: time
      format: iso8601

  # 냉난방 실내기 — 과제 4 '냉방 정지' 탐지와 과제 5 '빈 방 냉난방' 판단에 쓴다
  - name: xflow_idu
    topic: "xflow/hvacr/idu/{unit_id}/status"
    each: values                    # {"values": {"회의실": {...}}} 의 키가 공간 이름
    space:
      from: key
    payload:
      hvac_power: power
      hvac_mode: mode
      hvac_target_temperature: target_temperature
      hvac_current_temperature: current_temperature
      hvac_current_humidity: current_humidity
      hvac_fan_speed: fan_speed
      hvac_error_code: error_code
    timestamp:
      field: ts
      format: epoch_ms
