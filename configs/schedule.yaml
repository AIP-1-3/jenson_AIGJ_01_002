# 과제 5 '사용 여부' 정답. 한국 시간 기준. 분류기의 입력으로는 절대 쓰지 않는다 (채점용).
#
# source 로 정답의 출처를 보고서에 적는다:
#   timetable    : 실제 수업 시간표·회의실 예약표를 weekly/exceptions 에 옮긴 것
#   placeholder  : 시간표를 받기 전 임시 가정 (평일 9~18시) — 해석에 한계를 꼭 적는다
# 직접 관찰 기록이 있으면 observations_csv 가 시간표보다 우선한다.
source: timetable
# 출처 메모 (과제 5 보고서 측정 조건에 그대로 찍힌다)
note: "실습실 수업 평일 09:00~18:00 (민서 확인, 2026-10-20). 사무실은 근무 시간과 같다고 가정. 회의실은 예약표가 없어 평일 9~18시로 가정 — 회의실 사용 여부 정답은 신뢰도가 낮다"

weekly:                # 요일: mon tue wed thu fri sat sun
  실습실:              # 수업 시간표 (민서, 2026-10-20)
    - {days: [mon, tue, wed, thu, fri], start: "09:00", end: "18:00"}
  사무실:              # 가정: 근무 시간
    - {days: [mon, tue, wed, thu, fri], start: "09:00", end: "18:00"}
  회의실:              # 가정: 예약표 받으면 실제 예약으로 교체
    - {days: [mon, tue, wed, thu, fri], start: "09:00", end: "18:00"}

# 휴일·특강 등 예외. occupied: false 면 그 구간을 비어 있음으로 덮어쓴다.
exceptions: []
#  - {space: 실습실, date: "2026-10-09", start: "00:00", end: "24:00", occupied: false}   # 한글날

# 직접 관찰 기록 CSV (열: space,start,end,occupied — 시각은 "2026-10-21 13:05" 한국 시간)
observations_csv: data/observations.csv
