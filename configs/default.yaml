# 실험·서비스 공통 설정. 학습과 서비스가 같은 값을 읽어야 전처리가 어긋나지 않는다 (과제 8-3).

# 실제 교육장 공간 (ChirpStack 태그 location, 2026-10-20 확인).
# 과제 안내의 '강의실 2·회의실 1·라운지 1'과 구성이 다르다. 사무실 밖은 외기 기준으로 쓴다.
spaces:
  - 실습실
  - 사무실
  - 회의실
  - 사무실 밖

metrics: [co2, temperature, humidity]
timezone: Asia/Seoul              # 시간대 패턴·요일 판단용 (저장은 UTC)
# 공휴일 (한국 시간). 예측·상태 입력의 '평일 여부'와 검증일 선택에서 뺀다. 데이터 기간에 맞춰 추가.
holidays:
  - "2026-08-15"   # 광복절 (토)
  - "2026-08-17"   # 광복절 대체공휴일
  - "2026-09-24"   # 추석 연휴
  - "2026-09-25"   # 추석
  - "2026-09-26"   # 추석 연휴
  - "2026-10-03"   # 개천절 (토)
  - "2026-10-05"   # 개천절 대체공휴일
  - "2026-10-09"   # 한글날

preprocess:
  resample: 5min                 # 분석 간격 (과제 2-2, 근거는 reports/02_diagnosis.md 에)
  valid_range:                   # 물리적으로 불가능한 값 제거 (과제 2-1)
    co2: [350, 5000]
    temperature: [-10, 50]
    humidity: [0, 100]
  short_gap_max_minutes: 10      # 이하면 보간, 초과면 결측으로 둔다

split:                           # 시간순 분할 — 무작위 섞기 금지 (과제 2-3)
  # 실데이터 2026-07-22~ 기준 약 70/15/15. 시험 기간은 모델 선택에 쓰지 않는다.
  train_end: "2026-09-21"
  valid_end: "2026-10-06"

forecast:
  horizon_minutes: 60
  step_minutes: 5
  report_horizons: [5, 15, 30, 60]

model:                             # 과제 3 GRU (python -m tsinfer.models.forecast)
  lookback_minutes: 120            # 진단서의 CO₂ 정점까지 시간 보고 조정
  hidden: 64
  layers: 1
  dropout: 0.1
  epochs: 40
  batch_size: 256
  lr: 0.001
  patience: 6                      # 검증 손실이 이만큼 안 좋아지면 멈춤
  threads: 3                       # 공용 보드: CPU 6코어 중 절반만
  outdoor_space: 사무실 밖          # 외기 입력으로 쓰는 공간
  seed: 42

thresholds:
  co2_ventilate_ppm: 1000
  co2_critical_ppm: 1500
  ventilation_alert_within_minutes: 30
