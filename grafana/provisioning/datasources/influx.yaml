# InfluxDB 2.x (Flux). 값은 컨테이너 환경변수(.env 에서 옴)로 채운다.
apiVersion: 1
datasources:
  - name: InfluxDB
    uid: tsinfer-influx
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: iot-bucket
      timeout: 60
    secureJsonData:
      token: ${INFLUX_TOKEN}
