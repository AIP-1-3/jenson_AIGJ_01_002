# Jetson 에 내 Grafana 를 띄운다 (대시보드·데이터 소스 자동 등록).
# 학교 서버(influx.java21.net)는 Jetson 망에서 막혀 있어(2026-10-21 확인) 교육장 InfluxDB(.env 의 INFLUX_URL)를 본다.
#   docker compose --env-file .env -f grafana/docker-compose.yml up -d     # 저장소 루트에서
#   브라우저: http://<jetson>:${GRAFANA_PORT:-8130}  (계정 admin / .env 의 GRAFANA_ADMIN_PASSWORD)
# 공용 보드라 메모리 상한 300MB, 포트는 내 대역(8100~8199) 안에서 고른다.
services:
  grafana:
    image: grafana/grafana-oss:11.3.0          # arm64 이미지 포함
    container_name: grafana-tsinfer-${USER:-me}
    restart: unless-stopped
    mem_limit: 300m
    ports:
      - "${GRAFANA_PORT:-8130}:3000"
    environment:
      # 접속 정보는 .env 에서만 받는다 (이 파일·저장소에는 값을 넣지 않는다)
      INFLUX_URL: ${INFLUX_URL:?INFLUX_URL 을 .env 에 넣으세요}
      INFLUX_ORG: ${INFLUX_ORG:?INFLUX_ORG 를 .env 에 넣으세요}
      # iot-bucket 읽기 + tsinfer 읽기 권한이 있는 토큰 (과거 데이터용 INFLUX_TOKEN 과 따로 둔다)
      INFLUX_TOKEN: ${GRAFANA_INFLUX_TOKEN:?GRAFANA_INFLUX_TOKEN 을 .env 에 넣으세요}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 넣으세요}
      # 알림(provisioning/alerting)을 보낼 디스코드 웹훅. 텔레그램으로 바꾸면 contact-points.yaml 주석 참고
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL 을 .env 에 넣으세요 (docs/grafana.md 알림)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tsinfer-live.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data:
